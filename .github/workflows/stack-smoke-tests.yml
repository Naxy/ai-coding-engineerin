name: Stack Smoke Tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-spring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Maven tests
        working-directory: tests/fixtures/java-spring
        run: mvn --batch-mode --no-transfer-progress verify

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: tests/fixtures/go/go.mod
      - name: Go tests, vet and race detector
        working-directory: tests/fixtures/go
        run: |
          go test ./...
          go vet ./...
          go test -race ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest and run tests
        working-directory: tests/fixtures/python
        run: |
          python -m pip install --upgrade pip pytest
          PYTHONPATH=src python -m pytest -q

  vue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/fixtures/vue/package.json
      - name: Install and build Vue fixture
        working-directory: tests/fixtures/vue
        run: |
          npm install
          npm run build

  react-antd5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/fixtures/react-antd5/package.json
      - name: Install and build React + antd 5 fixture
        working-directory: tests/fixtures/react-antd5
        run: |
          npm install
          npm run build
